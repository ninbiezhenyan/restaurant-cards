<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SHY此生必打卡餐厅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #FAFAFA;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #1A1A1A;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===== 顶部导航 ===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 50px;
    background: #fff;
    border-bottom: 1px solid #F0F0F0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 100;
  }
  .topbar .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: #555;
    font-size: 18px;
    cursor: pointer;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .topbar .icon-btn:active { background: #F5F5F5; }
  .topbar .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #1A1A1A;
    white-space: nowrap;
  }

  /* 模式切换按钮 */
  .mode-toggle {
    display: flex;
    background: #F3F3F3;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .mode-toggle .mode-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    color: #999;
    border: none;
    outline: none;
    white-space: nowrap;
  }
  .mode-toggle .mode-btn.active {
    background: #FF4458;
    color: #fff;
  }

  /* ===== 主舞台 ===== */
  .stage {
    position: absolute;
    top: 50px;
    left: 0; right: 0;
    bottom: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 16px;
  }

  .card-wrapper {
    width: 100%;
    max-width: 360px;
    height: 50vh;
    max-height: 420px;
    min-height: 280px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ===== 卡片 ===== */
  .card {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: #FFF5F6;
    box-shadow: 0 4px 20px rgba(255,68,88,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.35s ease, transform 0.35s ease;
    opacity: 1;
    cursor: grab;
    border: 1px solid #FFE8EA;
  }
  .card.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
  .card.swiping { transition: none; cursor: grabbing; }

  /* ===== 类目卡片 ===== */
  .card-category {
    justify-content: center;
    align-items: center;
    padding: 0;
    background: #FFF5F6 !important;
    border: 2px solid #FFE0E3;
  }
  .cat-bg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
  }
  .cat-emoji {
    font-size: 80px;
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(255,68,88,0.12));
  }
  .cat-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #FF4458;
    text-shadow: 0 1px 3px rgba(255,68,88,0.06);
  }
  .cat-desc {
    font-size: 13px;
    color: #996666;
    line-height: 1.6;
    text-align: center;
    max-width: 220px;
  }
  .cat-count {
    margin-top: 4px;
    font-size: 13px;
    color: #CC8888;
    letter-spacing: 1px;
  }

  /* ===== 餐厅卡片 ===== */
  .card-restaurant {
    overflow: hidden;
    gap: 0;
    background: #FFF5F6;
  }
  .shop-photo {
    width: 100%;
    height: 45%;
    min-height: 140px;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
  }
  .shop-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex: 1;
    background: #FFF5F6;
  }
  .shop-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .shop-name {
    font-size: 19px;
    font-weight: 800;
    color: #1A1A1A;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 5px;
  }
  .shop-name .branch {
    font-size: 12px;
    font-weight: 500;
    color: #AAA;
  }
  .shop-name .tag {
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .shop-price {
    font-size: 17px;
    font-weight: 700;
    color: #FF4458;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .shop-price span { font-size: 11px; font-weight: 400; color: #AAA; }

  .shop-recommender {
    font-size: 12px;
    color: #999;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .shop-recommender .avt {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #FF4458;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .shop-features {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .shop-feat {
    font-size: 11px;
    color: #888;
    background: #FFF0F2;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .shop-addr {
    font-size: 12px;
    color: #AAA;
    line-height: 1.5;
  }

  .shop-dishes {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: auto;
    padding-top: 10px;
  }
  .dish {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 12px;
    background: #FFEFF1;
    color: #996666;
  }
  .dish.hot {
    background: #FFF0F0;
    color: #FF4458;
    font-weight: 600;
  }

  /* 标签色 */
  .tag-blue   { background: #039BE5 !important; }
  .tag-red    { background: #FF6B6B !important; }
  .tag-orange { background: #FF9800 !important; }
  .tag-cyan   { background: #00ACC1 !important; }

  /* ===== 提示语 ===== */
  .toast {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    font-weight: 700;
    color: #FF4458;
    opacity: 0;
    transition: opacity 0.4s;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== 进度圆点 ===== */
  .dots {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 50;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #FFD0D5;
    transition: background 0.3s, transform 0.3s;
  }
  .dot.on {
    background: #FF4458;
    transform: scale(1.4);
  }

  /* ===== 底部操作栏 ===== */
  .actions {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 100px;
    background: #fff;
    border-top: 1px solid #F0F0F0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }

  .action-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(255,68,88,0.08);
    border: 1px solid #FFE0E3;
    font-size: 22px;
    transition: transform 0.12s, box-shadow 0.12s;
    color: #FF4458;
  }
  .action-btn:active { transform: scale(0.9); }

  .action-btn.random-btn {
    font-size: 16px;
    font-weight: 700;
    width: auto;
    padding: 0 28px;
    border-radius: 28px;
    gap: 6px;
  }
  .action-btn.random-btn .btn-icon { font-size: 20px; }

  .action-btn.hiding { opacity: 0; transform: scale(0.8); pointer-events: none; }

  /* ===== 随机动画覆盖层 ===== */
  .spin-overlay {
    position: fixed;
    top: 50px;
    left: 0; right: 0; bottom: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 90;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .spin-overlay.active { opacity: 1; }
  .spin-count {
    font-size: 72px;
    font-weight: 900;
    color: #FF4458;
    text-shadow: 0 2px 16px rgba(255,68,88,0.2);
  }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="icon-btn" id="menuBtn">☰</div>
  <div class="title">SHY此生必打卡餐厅</div>
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active" data-mode="xinyi">心仪版</button>
    <button class="mode-btn" data-mode="suixin">随心版</button>
  </div>
</div>

<!-- 卡片舞台 -->
<div class="stage">
  <div class="card-wrapper" id="wrapper">
    <div class="card" id="card"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<!-- 进度圆点 -->
<div class="dots" id="dots"></div>

<!-- 底部操作栏 -->
<div class="actions">
  <div class="action-btn" id="btnNav">📍</div>
</div>

<script>
// ===================== 数据 =====================
const slides = [
  { type:'category', icon:'🦐', name:'海鲜菜', desc:'新鲜直达 原汁原味<br>金桥商圈品质之选', count:'1家店' },
  { type:'restaurant', icon:'🦐', name:'威海小海鲜', branch:'金高路店', tag:'海鲜', tagClass:'tag-blue',
    photo:'images/shop_1.jpg',
    price:123, recommender:'联名推荐', avatar:'联',
    addr:'浦东新区金高路2107号（金桥商圈）',
    mapQuery:'浦东新区金高路2107号威海小海鲜',
    features:['新鲜直达','家庭聚餐','性价比高'],
    dishes:[
      {name:'鸟贝',hl:1},{name:'清蒸海鲜（招牌）',hl:1},{name:'凉拌海肠',hl:1},
      {name:'舌头鱼'},{name:'白灼虾'},{name:'辣炒蛤蜊'},{name:'海鲜拼盘'}
    ]
  },
  { type:'category', icon:'🍲', name:'东北菜', desc:'锅气十足 量大管饱<br>凌河路·上川路一带', count:'3家店' },
  { type:'restaurant', icon:'🍲', name:'龙江顺天福', branch:'金桥店', tag:'东北菜', tagClass:'tag-red',
    photo:'images/shop_2.jpg',
    price:80, recommender:'申小红', avatar:'申',
    addr:'浦东凌河路（丰华高中东北侧）🚇12号线杨高北路',
    mapQuery:'龙江顺天福东北菜凌河路店',
    features:['09:30-24:00','东北地名包厢'],
    dishes:[
      {name:'锅包肉 ¥38',hl:1},{name:'小鸡炖蘑菇 ¥58'},{name:'猪肉炖粉条 ¥52'},
      {name:'韭菜盒子 ¥26'},{name:'地三鲜 ¥24'},{name:'鹅肉蒸饺',hl:1}
    ]
  },
  { type:'restaurant', icon:'🥘', name:'地锅岁月', branch:'凌河路店', tag:'东北菜', tagClass:'tag-red',
    photo:'images/shop_3.jpg',
    price:91, recommender:'申小红', avatar:'申',
    addr:'浦东新区凌河路576号',
    mapQuery:'浦东新区凌河路576号地锅岁月',
    features:['无预制菜','现点现烧','上海地方菜好评榜'],
    dishes:[
      {name:'地锅鸡（招牌）',hl:1},{name:'啤酒鸡排骨双人餐 ¥99',hl:1},{name:'贴饼子'},
      {name:'+牛蛙'},{name:'+牛肚'},{name:'+牛肉'}
    ]
  },
  { type:'restaurant', icon:'🔥', name:'薛记·传奇大锅台', branch:'上川路店', tag:'东北菜', tagClass:'tag-red',
    photo:'images/shop_4.jpg',
    price:106, recommender:'四五六七八次', avatar:'四',
    addr:'浦东新区曹路镇上川路2257号',
    mapQuery:'浦东新区曹路镇上川路2257号传奇大锅台',
    features:['10:00-02:00','现场选肉现炒','9店连锁'],
    dishes:[
      {name:'招牌地锅鸡（现炒）',hl:1},{name:'地锅鸡双人餐 ¥99',hl:1},{name:'排骨锅'},{name:'贴饼子'}
    ]
  },
  { type:'category', icon:'🐂', name:'火锅菜', desc:'牛骨慢熬 原汤醇厚<br>张江街边烟火小馆', count:'1家店' },
  { type:'restaurant', icon:'🐂', name:'大成牛肉汤馆', branch:'张江店', tag:'牛肉汤', tagClass:'tag-cyan',
    photo:'images/shop_5.jpg',
    price:65, recommender:'申小红', avatar:'申',
    addr:'浦东新区张江镇百业路232号一层',
    mapQuery:'浦东新区张江镇百业路232号大成牛肉汤馆',
    features:['牛骨慢熬原汤','街边烟火小店','价格实惠'],
    dishes:[
      {name:'牛骨原汤（招牌）',hl:1},{name:'牛肋排锅（灵魂）',hl:1},{name:'牛肉丸'},{name:'锅贴'},{name:'烧饼'}
    ]
  }
];

// 仅餐厅卡片索引
const restaurantIndices = [];
slides.forEach((s, i) => { if (s.type === 'restaurant') restaurantIndices.push(i); });

// ===================== 状态 =====================
let mode = 'xinyi'; // 'xinyi' | 'suixin'
let idx = 0;
let randomCount = 0;
let isSpinning = false;
const total = slides.length;
const card = document.getElementById('card');
const dotsEl = document.getElementById('dots');
const btnNav = document.getElementById('btnNav');
const toast = document.getElementById('toast');

// ===================== 圆点 =====================
function buildDots() {
  dotsEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === idx ? ' on' : '');
    dotsEl.appendChild(d);
  }
}
function updateDots() {
  dotsEl.querySelectorAll('.dot').forEach((d, i) => {
    d.className = 'dot' + (i === idx ? ' on' : '');
  });
}

// ===================== 提示语 =====================
function showToast(msg, duration = 2000) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  if (duration > 0) {
    toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
  }
}
function hideToast() {
  toast.classList.remove('show');
}

// ===================== 渲染 =====================
function render(instant = false) {
  const s = slides[idx];
  if (!s) return;

  if (s.type === 'category') {
    card.className = 'card card-category';
    if (!instant) card.classList.add('hidden');
    card.offsetHeight;
    card.innerHTML = `
      <div class="cat-bg">
        <div class="cat-emoji">${s.icon}</div>
        <div class="cat-name">${s.name}</div>
        <div class="cat-desc">${s.desc}</div>
        <div class="cat-count">— ${s.count} —</div>
      </div>
    `;
  } else {
    const dishesHTML = s.dishes.map(d =>
      `<span class="dish${d.hl ? ' hot' : ''}">${d.name}</span>`
    ).join('');
    const featHTML = s.features.map(f =>
      `<span class="shop-feat">${f}</span>`
    ).join('');
    const photoHTML = s.photo ? `<img class="shop-photo" src="${s.photo}" alt="${s.name}" onerror="this.style.display='none'">` : '';
    card.className = 'card card-restaurant';
    if (!instant) card.classList.add('hidden');
    card.offsetHeight;
    card.innerHTML = `
      ${photoHTML}
      <div class="shop-body">
        <div class="shop-header">
          <div class="shop-name">
            ${s.name} <span class="branch">(${s.branch})</span>
            <span class="tag ${s.tagClass}">${s.tag}</span>
          </div>
          <div class="shop-price">¥${s.price}<span>/人</span></div>
        </div>
        <div class="shop-recommender">
          <span class="avt">${s.avatar}</span> ${s.recommender} 推荐
        </div>
        <div class="shop-features">${featHTML}</div>
        <div class="shop-addr">📍 ${s.addr}</div>
        <div class="shop-dishes">${dishesHTML}</div>
      </div>
    `;
  }

  if (!instant) {
    requestAnimationFrame(() => {
      card.classList.remove('hidden');
      card.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
    });
  }
  updateDots();
  hideToast();
}

// ===================== 导航 =====================
function goTo(newIdx, dir = 0) {
  if (newIdx === idx || isSpinning) return;
  card.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
  card.style.opacity = '0';
  card.style.transform = `scale(0.96) translateX(${dir * 30}px)`;

  setTimeout(() => {
    idx = newIdx;
    card.style.transition = 'none';
    card.style.opacity = '0';
    card.style.transform = `scale(0.96) translateX(${-dir * 30}px)`;
    render(true);
    card.offsetHeight;
    requestAnimationFrame(() => {
      card.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
      card.style.opacity = '1';
      card.style.transform = '';
      setTimeout(() => { card.style.transition = ''; }, 400);
    });
  }, 260);
}

function goNext() {
  if (mode === 'xinyi') {
    const nxt = (idx + 1) % total;
    goTo(nxt, 1);
  }
}
function goPrev() {
  if (mode === 'xinyi') {
    const prv = (idx - 1 + total) % total;
    goTo(prv, -1);
  }
}

// ===================== 随机模式 =====================
function randomSpin() {
  if (isSpinning) return;
  isSpinning = true;
  hideToast();

  btnNav.style.pointerEvents = 'none';
  const duration = 2000;
  const interval = 80;
  const steps = Math.floor(duration / interval);
  let step = 0;

  const spinTimer = setInterval(() => {
    step++;
    // 快速切换所有 slides
    idx = restaurantIndices[Math.floor(Math.random() * restaurantIndices.length)];
    render(true);
    card.style.transition = 'none';

    if (step >= steps) {
      clearInterval(spinTimer);
      // 最终随机停在一个餐厅卡片上
      const finalIdx = restaurantIndices[Math.floor(Math.random() * restaurantIndices.length)];
      idx = finalIdx;
      card.style.transition = 'opacity 0.3s ease';
      card.style.opacity = '0';
      setTimeout(() => {
        render(true);
        card.style.opacity = '1';
        card.style.transition = '';

        randomCount++;
        if (randomCount >= 3) {
          showToast('好难选啊~', 0);
        } else {
          showToast('我中意你啦！', 0);
        }

        isSpinning = false;
        btnNav.style.pointerEvents = '';
      }, 300);
    }
  }, interval);
}

// ===================== 触屏 =====================
let startX = 0, dx = 0, dragging = false;

card.addEventListener('touchstart', e => {
  if (mode === 'suixin' || isSpinning) return;
  startX = e.touches[0].clientX; dx = 0; dragging = true;
  card.classList.add('swiping');
}, {passive: true});

card.addEventListener('touchmove', e => {
  if (!dragging) return;
  dx = e.touches[0].clientX - startX;
  const limit = 0.5;
  const clamped = Math.max(-card.offsetWidth * limit, Math.min(card.offsetWidth * limit, dx)) / (card.offsetWidth * limit);
  card.style.transform = `translateX(${clamped * 40}px) scale(${1 - Math.abs(clamped) * 0.04})`;
  card.style.opacity = 1 - Math.abs(clamped) * 0.5;
}, {passive: true});

card.addEventListener('touchend', () => {
  if (!dragging) return;
  dragging = false;
  card.classList.remove('swiping');
  if (dx < -50) goNext();
  else if (dx > 50) goPrev();
  else {
    card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    card.style.opacity = '1'; card.style.transform = '';
    setTimeout(() => { card.style.transition = ''; }, 300);
  }
});

// 鼠标
card.addEventListener('mousedown', e => {
  if (mode === 'suixin' || isSpinning) return;
  e.preventDefault(); startX = e.clientX; dx = 0; dragging = true;
  card.classList.add('swiping');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  dx = e.clientX - startX;
  const w = card.offsetWidth;
  const clamped = Math.max(-w * 0.5, Math.min(w * 0.5, dx)) / (w * 0.5);
  card.style.transform = `translateX(${clamped * 40}px) scale(${1 - Math.abs(clamped) * 0.04})`;
  card.style.opacity = 1 - Math.abs(clamped) * 0.5;
});
window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  card.classList.remove('swiping');
  if (dx < -50) goNext();
  else if (dx > 50) goPrev();
  else {
    card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    card.style.opacity = '1'; card.style.transform = '';
    setTimeout(() => { card.style.transition = ''; }, 300);
  }
});

// ===================== 模式切换 =====================
function switchMode(newMode) {
  if (newMode === mode || isSpinning) return;
  mode = newMode;
  randomCount = 0;
  hideToast();

  // 更新切换按钮状态
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  // 更新底部按钮
  if (mode === 'suixin') {
    btnNav.innerHTML = '<span class="btn-icon">🎲</span> 随机';
    btnNav.className = 'action-btn random-btn';
    dotsEl.style.opacity = '0.3';
  } else {
    btnNav.innerHTML = '📍';
    btnNav.className = 'action-btn';
    dotsEl.style.opacity = '1';
  }

  // 切到随心版时，确保当前在餐厅卡
  if (mode === 'suixin' && !restaurantIndices.includes(idx)) {
    idx = restaurantIndices[0];
    render(true);
    card.style.opacity = '1';
    card.style.transition = '';
  }
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => switchMode(btn.dataset.mode));
});

// ===================== 按钮 =====================
btnNav.addEventListener('click', () => {
  if (mode === 'suixin') {
    randomSpin();
  } else {
    const s = slides[idx];
    if (s.type === 'restaurant') {
      window.open(`https://www.amap.com/search?query=${encodeURIComponent(s.mapQuery)}`, '_blank');
    }
  }
});

document.getElementById('menuBtn').addEventListener('click', () => {
  alert('🍽️ SHY此生必打卡餐厅\n共 ' + total + ' 张卡片\n心仪版：左右滑动浏览\n随心版：点击随机帮你选');
});

document.getElementById('shareBtn') && document.getElementById('shareBtn').addEventListener('click', () => {
  const url = location.href;
  if (navigator.share) {
    navigator.share({ title: 'SHY此生必打卡餐厅', url });
  } else {
    navigator.clipboard.writeText(url).then(() => alert('链接已复制')).catch(() => alert(url));
  }
});

// ===================== 启动 =====================
buildDots();
render(true);
</script>
</body>
</html>
