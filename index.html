<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>好友推荐餐厅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #F5F0EB;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== 卡片视窗 ===== */
  .viewport {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    touch-action: pan-y;
  }

  .track {
    display: flex;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    will-change: transform;
  }

  /* ===== 卡片通用 ===== */
  .card {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 分类卡片 ===== */
  .cat-card {
    background: #fff;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 30px;
    cursor: default;
  }

  .cat-stripe {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
  }
  .cat-stripe.blue  { background: linear-gradient(90deg, #039BE5, #4FC3F7); }
  .cat-stripe.red   { background: linear-gradient(90deg, #FF6B6B, #FF8E53); }
  .cat-stripe.brown { background: linear-gradient(90deg, #8D6E63, #BCAAA4); }

  .cat-icon {
    font-size: 64px;
    margin-bottom: 16px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .cat-name {
    font-size: 28px;
    font-weight: 800;
    color: #2C1810;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .cat-desc {
    font-size: 14px;
    color: #999;
    margin-bottom: 4px;
    line-height: 1.6;
    max-width: 260px;
  }

  .cat-count {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
  }
  .cat-count.blue  { background: #039BE5; }
  .cat-count.red   { background: #FF6B6B; }
  .cat-count.brown { background: #8D6E63; }

  .cat-hint {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    font-size: 11px;
    color: #CCC;
    letter-spacing: 1px;
  }

  /* ===== 餐厅卡片 ===== */
  .shop-card {
    background: #fff;
    cursor: pointer;
  }

  .shop-card .shop-stripe { height: 6px; flex-shrink: 0; }
  .shop-stripe.blue  { background: linear-gradient(90deg, #039BE5, #4FC3F7); }
  .shop-stripe.red   { background: linear-gradient(90deg, #FF6B6B, #FF8E53); }
  .shop-stripe.green { background: linear-gradient(90deg, #6B9E5A, #8BC34A); }
  .shop-stripe.orange{ background: linear-gradient(90deg, #FF9800, #FFB74D); }
  .shop-stripe.brown { background: linear-gradient(90deg, #8D6E63, #BCAAA4); }

  .shop-body {
    padding: 18px 20px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .shop-name {
    font-size: 19px;
    font-weight: 700;
    color: #2C1810;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .shop-name .icon { font-size: 22px; }
  .branch {
    font-size: 12px;
    font-weight: 500;
    color: #AAA;
    white-space: nowrap;
  }
  .cuisine-tag {
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    padding: 2px 9px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .tag-blue  { background: #039BE5; }
  .tag-red   { background: #FF6B6B; }
  .tag-green { background: #8BC34A; }
  .tag-orange{ background: #FF9800; }
  .tag-brown { background: #8D6E63; }

  .price-badge {
    font-size: 15px;
    font-weight: 700;
    color: #E65100;
    white-space: nowrap;
  }
  .price-badge small { font-weight: 400; font-size: 11px; color: #AAA; }

  .stars {
    font-size: 14px;
    color: #F5A623;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .recommender-row {
    font-size: 13px;
    color: #999;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .recommender-row .avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #FFE0B2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #E65100;
    font-weight: 600;
    flex-shrink: 0;
  }
  .recommender-name { font-weight: 600; color: #666; }

  .addr {
    font-size: 12px;
    color: #AAA;
    margin-bottom: 10px;
    line-height: 1.5;
    display: flex;
    gap: 4px;
  }
  .addr .ico { flex-shrink: 0; }

  .sep {
    height: 1px;
    background: #F0F0F0;
    margin: 0 0 10px;
  }

  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .feat {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .feat-blue  { background: #E1F5FE; color: #01579B; border: 1px solid #81D4FA; }
  .feat-red   { background: #FFF3E0; color: #E65100; border: 1px solid #FFCC80; }
  .feat-green { background: #F1F8E9; color: #33691E; border: 1px solid #A5D6A7; }
  .feat-orange{ background: #FFF8E1; color: #E65100; border: 1px solid #FFE0B2; }
  .feat-brown { background: #EFEBE9; color: #4E342E; border: 1px solid #BCAAA4; }

  .dishes-label {
    font-size: 11px;
    font-weight: 700;
    color: #AAA;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .dishes {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    flex: 1;
    align-content: flex-start;
  }

  .dish {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .dish.hl { font-weight: 600; }

  .dish-blue   { background: #E1F5FE; color: #01579B; border: 1px solid #B3E5FC; }
  .dish-blue.hl   { background: #CAEEFE; }
  .dish-red    { background: #FFF0F0; color: #C62828; border: 1px solid #FFCDD2; }
  .dish-red.hl    { background: #FFE0E0; }
  .dish-green  { background: #F1F8E9; color: #33691E; border: 1px solid #C5E1A5; }
  .dish-green.hl  { background: #DCEED0; }
  .dish-orange { background: #FFF8E1; color: #E65100; border: 1px solid #FFE0B2; }
  .dish-orange.hl { background: #FFECD2; }
  .dish-brown  { background: #EFEBE9; color: #4E342E; border: 1px solid #D7CCC8; }
  .dish-brown.hl  { background: #E5DDD8; }

  /* ===== 进度条 ===== */
  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 3px;
    background: #EEE;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF6B6B, #FF8E53);
    transition: width 0.4s ease;
    border-radius: 0 2px 2px 0;
  }
</style>
</head>
<body>

<div class="viewport" id="viewport">
  <div class="track" id="track"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script>
// ===================== 数据 =====================
const slides = [
  // --- 海鲜菜 ---
  {
    type: 'category',
    icon: '🦐', name: '海鲜菜',
    desc: '新鲜直达，原汁原味<br>金桥商圈品质之选',
    count: '1家店',
    color: 'blue'
  },
  {
    type: 'restaurant',
    icon: '🦐', name: '威海小海鲜', branch: '金高路店', tag: '海鲜',
    price: 123,
    recommender: '联名', avatar: '联',
    addr: '浦东新区金高路2107号（金桥商圈）',
    mapQuery: '浦东新区金高路2107号威海小海鲜',
    features: ['🐟 海鲜新鲜直达','👨‍👩‍👧 家庭聚餐','💯 性价比高'],
    stripe: 'blue', tagClass: 'tag-blue', featClass: 'feat-blue', dishClass: 'dish-blue',
    dishes: [
      { name: '🐚 鸟贝', hl: true },
      { name: '清蒸海鲜（招牌）', hl: true },
      { name: '凉拌海肠', hl: true },
      { name: '舌头鱼' },
      { name: '白灼虾' },
      { name: '辣炒蛤蜊' },
      { name: '海蛎子' },
      { name: '海鲜拼盘' }
    ]
  },

  // --- 东北菜 ---
  {
    type: 'category',
    icon: '🍲', name: '东北菜',
    desc: '锅气十足，量大管饱<br>凌河路 · 上川路一带',
    count: '3家店',
    color: 'red'
  },
  {
    type: 'restaurant',
    icon: '🍲', name: '龙江顺天福', branch: '金桥店', tag: '东北菜',
    price: 80,
    recommender: '申小红', avatar: '申',
    addr: '浦东凌河路（丰华高中东北侧） 🚇12号线杨高北路',
    mapQuery: '龙江顺天福东北菜凌河路店',
    features: ['🕘 09:30-24:00','🏠 东北地名包厢'],
    stripe: 'red', tagClass: 'tag-red', featClass: 'feat-red', dishClass: 'dish-red',
    dishes: [
      { name: '锅包肉 ¥38', hl: true },
      { name: '小鸡炖蘑菇 ¥58' },
      { name: '猪肉炖粉条 ¥52' },
      { name: '韭菜盒子 ¥26' },
      { name: '地三鲜 ¥24' },
      { name: '鹅肉蒸饺', hl: true },
      { name: '大骨棒炖酸菜' }
    ]
  },
  {
    type: 'restaurant',
    icon: '🥘', name: '地锅岁月', branch: '凌河路店', tag: '东北菜',
    price: 91,
    recommender: '申小红', avatar: '申',
    addr: '浦东新区凌河路576号（原地锅壹號）',
    mapQuery: '浦东新区凌河路576号地锅岁月',
    features: ['🚫 无预制菜','👨‍🍳 现点现烧','🏅 上海地方菜好评榜'],
    stripe: 'green', tagClass: 'tag-red', featClass: 'feat-green', dishClass: 'dish-green',
    dishesLabel: '🍗 推荐菜 · ⭐ 大众4.1 | 🎵 抖音4.5',
    dishes: [
      { name: '🔥 地锅鸡（招牌）', hl: true },
      { name: '🍺 啤酒鸡排骨双人餐 ¥99', hl: true },
      { name: '贴饼子' },
      { name: '+牛蛙' },
      { name: '+牛肚' },
      { name: '+牛肉' },
      { name: '+昂刺鱼' }
    ]
  },
  {
    type: 'restaurant',
    icon: '🔥', name: '薛记·传奇大锅台', branch: '上川路店', tag: '东北菜',
    price: 106,
    recommender: '四五六七八次', avatar: '四',
    addr: '浦东新区曹路镇上川路2257号',
    mapQuery: '浦东新区上川路2257号传奇大锅台',
    features: ['🕘 10:00-02:00','🔪 现场选肉现炒','🏪 9店连锁'],
    stripe: 'orange', tagClass: 'tag-red', featClass: 'feat-orange', dishClass: 'dish-orange',
    dishes: [
      { name: '🐔 招牌地锅鸡（现炒）', hl: true },
      { name: '💰 地锅鸡双人餐 ¥99', hl: true },
      { name: '排骨锅' },
      { name: '贴饼子' },
      { name: '土鸡现选' },
      { name: '量大管饱' }
    ]
  },

  // --- 火锅菜 ---
  {
    type: 'category',
    icon: '🐂', name: '火锅菜',
    desc: '牛骨慢熬，原汤醇厚<br>张江街边烟火小馆',
    count: '1家店',
    color: 'brown'
  },
  {
    type: 'restaurant',
    icon: '🐂', name: '大成牛肉汤馆', branch: '张江店', tag: '牛肉汤',
    price: 65,
    recommender: '申小红', avatar: '申',
    addr: '浦东新区张江镇百业路232号一层',
    mapQuery: '浦东新区张江镇百业路232号大成牛肉汤馆',
    features: ['🦴 牛骨慢熬原汤','🏠 街边烟火小店','💰 价格实惠'],
    stripe: 'brown', tagClass: 'tag-brown', featClass: 'feat-brown', dishClass: 'dish-brown',
    dishes: [
      { name: '🦴 牛骨原汤（招牌）', hl: true },
      { name: '🥩 牛肋排锅（灵魂）', hl: true },
      { name: '🍲 牛排牛大骨双拼锅', hl: true },
      { name: '牛肉丸' },
      { name: '锅贴' },
      { name: '烧饼' }
    ]
  }
];

// ===================== 构建卡片 =====================
function buildCategoryCard(s) {
  return `
  <div class="card cat-card" style="position:relative">
    <div class="cat-stripe ${s.color}"></div>
    <span class="cat-icon">${s.icon}</span>
    <div class="cat-name">${s.name}</div>
    <div class="cat-desc">${s.desc}</div>
    <span class="cat-count ${s.color}">${s.count}</span>
    <div class="cat-hint">← 左右滑动浏览 →</div>
  </div>`;
}

function buildRestaurantCard(s) {
  const dishesHTML = s.dishes.map(d =>
    `<span class="dish ${s.dishClass}${d.hl ? ' hl' : ''}">${d.name}</span>`
  ).join('\n            ');

  const featuresHTML = s.features.map(f =>
    `<span class="feat ${s.featClass}">${f}</span>`
  ).join('\n            ');

  const label = s.dishesLabel || '🍖 推荐菜';

  return `
  <div class="card shop-card" data-map="${s.mapQuery}">
    <div class="shop-stripe ${s.stripe}"></div>
    <div class="shop-body">
      <div class="title-row">
        <div class="shop-name"><span class="icon">${s.icon}</span>${s.name}<span class="branch">(${s.branch})</span><span class="cuisine-tag ${s.tagClass}">${s.tag}</span></div>
        <div class="price-badge">¥${s.price}<small>/人</small></div>
      </div>
      <div class="stars">★★★★★</div>
      <div class="recommender-row">
        <span class="avatar">${s.avatar}</span><span class="recommender-name">${s.recommender}</span> 推荐
      </div>
      <div class="addr"><span class="ico">📍</span>${s.addr}</div>
      <div class="features">${featuresHTML}</div>
      <div class="sep"></div>
      <div class="dishes-label">${label}</div>
      <div class="dishes">${dishesHTML}</div>
    </div>
  </div>`;
}

// ===================== 状态 =====================
const totalSlides = slides.length;
let currentIndex = 0;
let touchStartX = 0;
let touchEndX = 0;
let isDragging = false;

const track = document.getElementById('track');
const viewport = document.getElementById('viewport');
const progressFill = document.getElementById('progressFill');

// ===================== 渲染 =====================
function renderAll() {
  track.innerHTML = slides.map(s =>
    s.type === 'category' ? buildCategoryCard(s) : buildRestaurantCard(s)
  ).join('');

  // 绑定餐厅卡片点击
  track.querySelectorAll('.shop-card').forEach(card => {
    card.addEventListener('click', () => {
      if (Math.abs(touchEndX - touchStartX) < 10) {
        window.open(`https://www.amap.com/search?query=${encodeURIComponent(card.dataset.map)}`, '_blank');
      }
    });
  });

  updatePosition(false);
  updateProgress();
}

function updatePosition(animate = true) {
  track.style.transition = animate
    ? 'transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)'
    : 'none';
  track.style.transform = `translateX(-${currentIndex * 100}%)`;
}

function updateProgress() {
  const pct = ((currentIndex + 1) / totalSlides * 100).toFixed(1);
  progressFill.style.width = pct + '%';
}

// ===================== 导航 =====================
function goNext() {
  if (currentIndex < totalSlides - 1) {
    currentIndex++;
    updatePosition();
    updateProgress();
  }
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    updatePosition();
    updateProgress();
  }
}

// ===================== 触屏滑动 =====================
viewport.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  isDragging = true;
}, { passive: true });

viewport.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  touchEndX = e.touches[0].clientX;
  const diff = touchEndX - touchStartX;

  const clamped = currentIndex === 0 && diff > 0 ? 0 :
                  currentIndex >= totalSlides - 1 && diff < 0 ? 0 : diff;
  track.style.transition = 'none';
  track.style.transform = `translateX(calc(-${currentIndex * 100}% + ${clamped}px))`;
}, { passive: true });

viewport.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  const diff = touchEndX - touchStartX;
  const threshold = 50;
  track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)';

  if (diff < -threshold) goNext();
  else if (diff > threshold) goPrev();
  else updatePosition();
});

// ===================== 鼠标拖拽 =====================
viewport.addEventListener('mousedown', (e) => {
  touchStartX = e.clientX;
  isDragging = true;
  e.preventDefault();
});

viewport.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  touchEndX = e.clientX;
});

viewport.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  const diff = touchEndX - touchStartX;
  const threshold = 50;
  track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)';

  if (diff < -threshold) goNext();
  else if (diff > threshold) goPrev();
  else updatePosition();
});

viewport.addEventListener('mouseleave', () => {
  if (isDragging) { isDragging = false; updatePosition(); }
});

// ===================== 键盘 =====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'ArrowRight') goNext();
});

// ===================== 启动 =====================
renderAll();
</script>

</body>
</html>
